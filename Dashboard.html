<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080514;
    color: white;
}

header {
    background: #100824;
    padding: 22px;
    text-align: center;
    color: #d946ef;
    box-shadow: 0 0 20px #a000ff;
}

.container {
    display: flex;
    min-height: 90vh;
}

.sidebar {
    width: 230px;
    background: #120a25;
    padding: 25px 15px;
}

.sidebar a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid #8b2cff;
    border-radius: 10px;
}

.sidebar a:hover {
    background: #a000ff;
    box-shadow: 0 0 15px #a000ff;
}

.main {
    flex: 1;
    padding: 30px;
}

h2 {
    color: #d946ef;
    margin-bottom: 25px;
}

.cards {
    display: grid;
    grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}

.card {
    background: #160b2c;
    padding: 30px 20px;
    border: 1px solid #a000ff;
    border-radius: 15px;
    box-shadow: 0 0 12px #7700ff;
    text-align: center;
}

.card h3 {
    color: #d946ef;
    margin-bottom: 15px;
}

.card p {
    font-size: 28px;
    font-weight: bold;
}

.logout {
    background: #e000ff !important;
}

@media(max-width:600px) {
    .container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
    }

    .main {
        padding: 20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>NEON ADMIN DASHBOARD</h1>
</header>

<div class="container">

    <nav class="sidebar">
        <a href="#home">🏠 Home</a>
        <a href="#users">👥 Users</a>
        <a href="#products">📦 Products</a>
        <a href="#reports">📊 Reports</a>
        <a href="index.html" class="logout"
           onclick="return confirm('Logout?')">
           🚪 Logout
        </a>
    </nav>

    <main class="main" id="home">

        <h2>Welcome Admin!</h2>

        <div class="cards">

            <div class="card" id="users">
                <h3>Total Users</h3>
                <p>0</p>
            </div>

            <div class="card" id="products">
                <h3>Total Products</h3>
                <p>0</p>
            </div>

            <div class="card" id="reports">
                <h3>Total Reports</h3>
                <p>0</p>
            </div>

            <div class="card">
                <h3>System Status</h3>
                <p style="color:#00ff88">
                    Active
                </p>
            </div>

        </div>

    </main>
</div>

</body>
</html>
